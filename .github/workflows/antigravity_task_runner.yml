# ==============================================================================
# ProjectKnight Antigravity Task Runner - GitHub Actions Workflow
# Location: .github/workflows/antigravity_task_runner.yml
# Execution: Self-Hosted Windows Runner on Local Workstation
# Security Policy:
#   1. Manual Approval (workflow_dispatch) only; no PR or untrusted triggers.
#   2. Restricted strictly to jjangmut/ProjectKnight repository and authorized actor.
#   3. Task ID strictly validated against allowed pattern (^[A-Za-z0-9_\-]+$).
#   4. Task specification must exist in STUDIO_V3/tasks/<task_id>.md.
#   5. Target branch must match approved pattern (studio/v3-*, test/v3-*) and forbidden branches blocked.
#   6. Isolated execution in dedicated Git Worktree (main workspace protected).
#   7. Pre-commit scope validation aborts push on unauthorized file changes.
# ==============================================================================

name: Antigravity Automated Task Runner

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Approved Task ID (e.g. V3-TEST-AUTOMATION, V3-018)"
        required: true
        type: string
      force_rerun:
        description: "Force re-execution even if recorded as completed"
        required: false
        type: boolean
        default: false
      skip_push:
        description: "Skip git push after execution"
        required: false
        type: boolean
        default: false

concurrency:
  group: antigravity-projectknight-runner
  cancel-in-progress: false

jobs:
  run-task:
    name: Execute Task with Antigravity
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    if: github.repository == 'jjangmut/ProjectKnight' && github.actor == 'jjangmut'

    steps:
      - name: Security Pre-Flight Audit
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Security Pre-Flight Audit"
          Write-Host "Repository:   ${{ github.repository }}"
          Write-Host "Triggered By: ${{ github.actor }}"
          Write-Host "Task ID:      ${{ inputs.task_id }}"
          Write-Host "=========================================="

          # 1. Repository Boundary Verification
          if ("${{ github.repository }}" -ne "jjangmut/ProjectKnight") {
            Write-Error "Security Reject: Unauthorized repository (${{ github.repository }})."
            exit 1
          }

          # 2. Actor Boundary Verification
          if ("${{ github.actor }}" -ne "jjangmut") {
            Write-Error "Security Reject: Unauthorized actor (${{ github.actor }})."
            exit 1
          }

          # 3. Task ID Format Validation (Block command injection, path traversal)
          $taskId = "${{ inputs.task_id }}".Trim()
          if ($taskId -notmatch '^[A-Za-z0-9_\-]+$') {
            Write-Error "Security Reject: Task ID contains illegal characters: '$taskId'"
            exit 1
          }

          if ($taskId -notmatch '^(?:V3-[0-9]{3}[A-Za-z0-9_\-]*|V3-TEST-[A-Za-z0-9_\-]+)$') {
            Write-Error "Security Reject: Task ID '$taskId' does not match approved ProjectKnight naming convention."
            exit 1
          }

          Write-Host "Pre-Flight security audit PASSED."

      - name: Execute Antigravity Runner
        shell: powershell
        run: |
          $runnerScript = "D:\JUNYPAPA_STUDIO\Automation\ProjectKnight\runner.ps1"
          if (-not (Test-Path $runnerScript)) {
            Write-Error "Automation runner not found at: $runnerScript"
            exit 1
          }

          $taskId = "${{ inputs.task_id }}".Trim()

          $params = @{
            Action = "Execute"
            TaskId = $taskId
            AutoApprove = $true
          }

          if ("${{ inputs.force_rerun }}" -eq "true") {
            $params["Force"] = $true
          }
          if ("${{ inputs.skip_push }}" -eq "true") {
            $params["SkipPush"] = $true
          }

          Write-Host "Launching Runner with parameters:"
          $params | Out-String | Write-Host

          & $runnerScript @params
