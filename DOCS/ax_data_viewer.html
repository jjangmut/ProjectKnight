<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEROES WAR : AX TACTICAL CODEX v2.0 — Project Knight</title>
  <style>
    :root {
      --bg-deep: #060a10;
      --bg-panel: #0e1622;
      --bg-card: #101b29;
      --accent-amber: #ffb800;
      --accent-cyan: #00e5ff;
      --accent-crimson: #ff3b5c;
      --accent-emerald: #34d399;
      --accent-purple: #c084fc;
      --border-slate: #22364a;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(180deg, rgba(255,184,0,0.06) 0%, transparent 180px),
        radial-gradient(circle at 80% 0%, #102438 0%, var(--bg-deep) 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.55;
      border-top: 4px solid var(--accent-amber);
    }
    .container { max-width: 1380px; margin: 0 auto; }
    header {
      background: var(--bg-panel);
      border: 2px solid var(--accent-cyan);
      border-left: 8px solid var(--accent-amber);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 12px 32px rgba(0, 229, 255, 0.12);
      margin-bottom: 16px;
    }
    .brand-tag {
      display: inline-block;
      background: var(--accent-amber);
      color: #060a10;
      font-weight: 800;
      font-size: 12px;
      padding: 3px 10px;
      margin-bottom: 4px;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
    }
    .brand h1 { font-size: 22px; color: var(--text-main); letter-spacing: 0.6px; }
    .brand p { font-size: 12px; color: var(--accent-cyan); margin-top: 2px; font-weight: 600; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-input {
      background: #070c14;
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      padding: 10px 14px;
      width: 290px;
      font-size: 13px;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }
    .search-input:focus { outline: none; border-color: var(--accent-amber); }
    .btn {
      background: #0f1824;
      border: 1px solid var(--border-slate);
      border-left: 4px solid var(--accent-cyan);
      color: var(--text-sub);
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.15s;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    .btn:hover, .btn.active {
      background: #2b200b;
      border-color: var(--accent-amber);
      border-left: 6px solid var(--accent-amber);
      color: #fffbeb;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-slate);
      border-left: 5px solid var(--accent-cyan);
      padding: 14px 16px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }
    .kpi-card .label { font-size: 12px; color: var(--text-sub); font-weight: 700; }
    .kpi-card .val { font-size: 20px; font-weight: 800; margin: 5px 0 3px; color: var(--accent-amber); }
    .kpi-card .desc { font-size: 12px; color: #cbd5e1; }
    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border-slate);
      border-left: 6px solid var(--accent-cyan);
      padding: 16px 20px;
      margin-bottom: 12px;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    }
    .card.amber { border-left-color: var(--accent-amber); }
    .card.crimson { border-left-color: var(--accent-crimson); }
    .card.emerald { border-left-color: var(--accent-emerald); }
    .card.purple { border-left-color: var(--accent-purple); }
    .card h2 { font-size: 17px; color: var(--accent-amber); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 12px; }
    .stat-row { display: flex; align-items: center; gap: 12px; margin: 7px 0; font-size: 13px; }
    .stat-name { width: 165px; color: #cbd5e1; font-weight: 600; }
    .stat-bar-bg { flex: 1; height: 11px; background: #060a10; border: 1px solid #1e293b; overflow: hidden; }
    .stat-bar-fill { height: 100%; }
    .stat-val { width: 125px; text-align: right; font-weight: 700; color: #fff; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      background: #162636;
      color: var(--accent-cyan);
      clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 0 100%);
    }
    .badge.ssr { background: var(--accent-crimson); color: #fff; }
    .badge.amber { background: var(--accent-amber); color: #060a10; }
    .pattern-box {
      background: #080d15;
      border: 1px solid #1e3448;
      border-left: 4px solid var(--accent-cyan);
      padding: 9px 14px;
      margin-top: 7px;
    }
    pre.json-box {
      background: #05080d;
      border: 1px solid var(--accent-cyan);
      border-left: 6px solid var(--accent-amber);
      color: #6ee7b7;
      padding: 18px;
      overflow-x: auto;
      font-size: 12px;
      max-height: 72vh;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { padding: 9px 12px; border-bottom: 1px solid #1a2938; text-align: left; }
    th { color: var(--accent-amber); background: #091019; font-weight: 800; }
  </style>
</head>

        {

          patterns: [
            { id: "DARK_CRESCENT_WAVE", name_ko: "암흑 초승달 공허 검기", dmg: 2, metrics: "탄속 13.5 m/s · 2페이즈 피해 3 강화", desc: "심연의 대검을 휘둘러 전방을 관통하는 흑자색 초승달 검기 사출" },
            { id: "SHADOW_BLINK_STRIKE", name_ko: "그림자 배후 순간이동 급습", dmg: 3, metrics: "플레이어 후방 2.2m 즉시 전이 후 참격", desc: "공허의 틈으로 사라진 뒤 플레이어 등 뒤 2.2m에 나타나 치명적인 베기 수행" },
            { id: "MELEE_CLEAVE", name_ko: "심판의 대검 2연격", dmg: 2, metrics: "사거리 2.6m · 광역 횡베기", desc: "보이드 에너지를 머금은 대검으로 전방을 넓게 2회 베어냄" },
            { id: "JUDGMENT_STORM", name_ko: "종말의 심판 보이드 스톰", dmg: 2, metrics: "2페이즈 궁극기 · 반경 5.5m 다단 공허 파동", desc: "공중으로 부양하며 성채 전체에 심연의 번개와 공허 충격파를 방사" }
          ]
        }
      ],
      shop: [
        { id: "hp_boost", name_ko: "생명의 축복 (Max HP +1)", cost: 25, max: 2, desc: "성기사의 최대 체력을 영구적으로 +1 증가 (최대 +2 HP)" },
        { id: "dmg_boost", name_ko: "칼날 연마 (Attack Power +1)", cost: 35, max: 1, desc: "모든 성검 기본 공격 및 콤보 피해량을 영구적으로 +1 증가" },
        { id: "shadow_dash", name_ko: "그림자 걸음 (Shadow Dash)", cost: 50, max: 1, desc: "적의 공격과 탄막을 무적으로 통과하는 그림자 회피 대시 해금" },
        { id: "heal_full", name_ko: "영혼의 성유 (체력 완전 회복)", cost: 10, max: 99, desc: "성스러운 기름으로 즉시 최대 체력까지 100% 회복" },
        { id: "shard_boost_30", name_ko: "성소의 기도 (파편 +30개 보급)", cost: 0, max: 99, desc: "성소의 축복(또는 VIP 즉시 수령)을 통해 영혼 파편 30개 즉시 획득" }
      ],
      relics: [
        { stage: 1, id: "bastion_shield", name_ko: "타락한 사령관의 수호 방패", title_ko: "성기사의 황금 대검 & 이지스", rarity: "전설 유물", color: "#ffd940", desc: "저스트 패링 시 3배 치명타 반격 및 가드 시 황금 이지스 결계 전개" },
        { stage: 2, id: "shadow_cloak", name_ko: "심연 맹수의 그림자 망토", title_ko: "윈드러너의 질주 날개", rarity: "전설 유물", color: "#1fc785", desc: "그림자 대시 쿨타임 -25% 감소 및 이동 속도 영구 증가" },
        { stage: 3, id: "piercing_quiver", name_ko: "폐허 저격수의 예기 화살깃", title_ko: "비전 룬 크리스탈 대검", rarity: "전설 유물", color: "#40e0ff", desc: "3단 콤보 피니셔 검기 사거리 +40% 및 탄속 +20% 증가" },
        { stage: 4, id: "golem_pauldrons", name_ko: "고대 수호자의 룬 견갑", title_ko: "타이탄 암석 중갑", rarity: "신화 유물", color: "#f2a633", desc: "최대 체력 +1 영구 증가 및 착지 시 대지 강타 충격파 발생" },
        { stage: 5, id: "abyssal_crown", name_ko: "심연 심판관의 공허 날개깃", title_ko: "심연 정복자의 뿔 면류관", rarity: "신화 유물", color: "#d973ff", desc: "저스트 패링 치명타 강화 및 기본 공격력 +1 영구 상승" }
      ]
    };

    const TABS = ["◢ 01. 작전 총람", "◢ 02. 영웅 스펙", "◢ 03. 전장 구역", "◢ 04. 적성 개체", "◢ 05. 보스 파일", "◢ 06. 웨폰/유물"];
    let currentTab = 0;
    let showJson = false;

    function selectTab(idx) {
      currentTab = idx;
      showJson = false;
      document.getElementById('searchInput').value = '';
      render();
    }

    function toggleJson() {
      showJson = !showJson;
      render();
    }

    function statBar(name, val, max, text, color) {
      const pct = Math.min(100, Math.max(5, (val / max) * 100));
      return `<div class="stat-row">
        <div class="stat-name">${name}</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <div class="stat-val">${text}</div>
      </div>`;
    }

    function render() {
      const tabBar = document.getElementById('tabBar');
      tabBar.innerHTML = TABS.map((t, i) => `<button class="btn ${i === currentTab && !showJson ? 'active' : ''}" onclick="selectTab(${i})">${t}</button>`).join('');
      document.getElementById('jsonBtn').textContent = showJson ? '📋 DOSSIER VIEW' : '{ } RAW JSON';

      const area = document.getElementById('contentArea');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();

      if (showJson) {
        area.innerHTML = `<pre class="json-box">${JSON.stringify(AX_DATA, null, 2)}</pre>`;
        return;
      }

      if (q.length > 0) {
        const matches = [];
        if (JSON.stringify(AX_DATA.player).toLowerCase().includes(q)) matches.push({ cat: "SSR HERO", title: AX_DATA.player.name_ko, desc: "HP 8 · 이동속도 7.5 · 3단 성검 콤보 & 신성 관통창 검기 · 저스트 패링 0.14s" });
        AX_DATA.stages.forEach(s => { if (JSON.stringify(s).toLowerCase().includes(q)) matches.push({ cat: `OP-0${s.stage_num}`, title: s.name_ko, desc: `${s.theme} | 보스: ${s.boss} | 웨이브: ${s.wave1}` }); });
        AX_DATA.enemies.forEach(e => { if (JSON.stringify(e).toLowerCase().includes(q)) matches.push({ cat: `UNIT (OP-0${e.stage})`, title: `${e.name_ko} (${e.role})`, desc: `HP ${e.hp} · 속도 ${e.speed} · ${e.mech}` }); });
        AX_DATA.bosses.forEach(b => { if (JSON.stringify(b).toLowerCase().includes(q)) matches.push({ cat: `EX-BOSS (OP-0${b.stage})`, title: `${b.name_ko} — ${b.title_ko}`, desc: `HP ${b.hp} · 패턴: ${b.patterns.map(p=>p.name_ko).join(', ')}` }); });
        AX_DATA.relics.forEach(r => { if (JSON.stringify(r).toLowerCase().includes(q)) matches.push({ cat: `RELIC (OP-0${r.stage})`, title: `[${r.rarity}] ${r.name_ko}`, desc: r.desc }); });
        area.innerHTML = `<div class="card amber"><h2>🔍 TACTICAL SEARCH '${q}' (${matches.length} MATCHES)</h2>${matches.map(m => `<div class="pattern-box"><span class="badge amber">${m.cat}</span> <strong>${m.title}</strong><p style="margin-top:4px;color:#cbd5e1;">${m.desc}</p></div>`).join('') || '<p>일치하는 전술 데이터가 없습니다.</p>'}</div>`;
        return;
      }

      if (currentTab === 0) {
        area.innerHTML = `
          <div class="card amber">
            <h2><span class="badge amber">COMMAND BRIEFING</span> ${AX_DATA.meta.title_ko}</h2>
            <p style="color:#cbd5e1;">${AX_DATA.meta.description}</p>
          </div>
          <div class="kpi-grid">
            <div class="kpi-card"><div class="label">◢ OP-ZONES (캠페인 전장)</div><div class="val">5 OPERATIONS</div><div class="desc">OP-01 성문 외곽 ~ OP-05 침묵의 성채</div></div>
            <div class="kpi-card"><div class="label">◢ BOSS THREATS (보스전)</div><div class="val">5 BOSS / 17 PATTERNS</div><div class="desc">HP 50% 이하 2페이즈 오버드라이브 각성</div></div>
            <div class="kpi-card"><div class="label">◢ HOSTILE UNITS (적성 개체)</div><div class="val">5 ARCHETYPES</div><div class="desc">보병 · 도약 맹수 · 저격수 · 거석 골렘 · 심연 기사</div></div>
            <div class="kpi-card"><div class="label">◢ SSR HERO SPEC (영웅 기동)</div><div class="val">8 ACTION STATES</div><div class="desc">3단 성검 찌르기 · 관통창 검기 · 0.14s 패링</div></div>
            <div class="kpi-card"><div class="label">◢ SANCTUARY LAB (연구소)</div><div class="val">5 UPGRADES / 5 RELICS</div><div class="desc">영혼 파편 영구 성장 및 전설/신화 아티팩트</div></div>
            <div class="kpi-card"><div class="label">◢ CAMERA & PHYSICS</div><div class="val">PITCH -32° / FOV 42°</div><div class="desc">사이드 쿼터뷰 벨트스크롤 · 4면 방벽</div></div>
          </div>`;
      } else if (currentTab === 1) {
        const p = AX_DATA.player;
        area.innerHTML = `
          <div class="grid-2">
            <div class="card amber">
              <h2><span class="badge ssr">SSR · VANGUARD</span> ${p.name_ko} (${p.name_en})</h2>
              ${statBar('최대 체력 (Max HP)', p.base_stats.max_hp, 12, p.base_stats.max_hp + ' HP', '#ff3b5c')}
              ${statBar('횡기동 속도 (Speed X)', p.base_stats.move_speed_x, 15, p.base_stats.move_speed_x + ' m/s', '#00e5ff')}
              ${statBar('종기동 속도 (Depth Z)', p.base_stats.move_speed_z, 15, p.base_stats.move_speed_z + ' m/s', '#34d399')}
              ${statBar('택티컬 대시 (Dash)', p.base_stats.dash_speed, 20, p.base_stats.dash_speed + ' m/s', '#c084fc')}
              ${statBar('피격 무적 (i-Frame)', p.base_stats.hit_invuln_duration, 1.5, p.base_stats.hit_invuln_duration + ' sec', '#ffb800')}
            </div>
            <div class="card">
              <h2>◢ TACTICAL SKILL DECK & PARRY FORMULA</h2>
              <p>▸ <strong>[SKILL 1 : 3-COMBO THRUST]</strong> 기본 피해 2 DMG (지속 0.20s / 쿨타임 0.22s / 콤보유지 0.95s)</p>
              <p>▸ <strong>[HYBRID HITBOX]</strong> 전방 X 2.9m × 깊이 Z ±1.65m 전술 영역 100% 적중 보장</p>
              <p>▸ <strong>[FINISHER : HOLY LANCE BEAM]</strong> 탄속 20.0 m/s · 사거리 24.0m · 관통 피해 2 DMG</p>
              <p>▸ <strong>[SKILL 2 : AEGIS JUST PARRY]</strong> 0.14초 이내 가드 시 피해 100% 무효화 + 적 2.0초 스턴</p>
              <p>▸ <strong>[COUNTER OVERDRIVE]</strong> 3.5초간 다음 공격 3배 피해 (6 DMG 황금 일격)</p>
            </div>
          </div>
          <div class="card">
            <h2>◢ MOTION CAPTURE & SPRITE SHEET MATRIX (780×780 무게중심 정렬)</h2>
            <table>
              <thead><tr><th>STATE</th><th>SPRITE SHEET</th><th>GRID</th><th>FPS</th><th>TACTICAL DESCRIPTION</th></tr></thead>
              <tbody>${p.animations.map(a => `<tr><td><span class="badge">${a.state}</span></td><td><code>${a.sheet}</code></td><td>${a.grid}</td><td>${a.fps} FPS</td><td>${a.desc}</td></tr>`).join('')}</tbody>
            </table>
          </div>`;
      } else if (currentTab === 2) {
        area.innerHTML = AX_DATA.stages.map(s => `
          <div class="card" style="border-left-color: ${s.ambient};">
            <h2><span class="badge amber">OP-0${s.stage_num}</span> ${s.name_ko} (${s.name_en})</h2>
            <p>▸ <strong>전장 테마:</strong> ${s.theme} | <strong>작전 반경:</strong> ${s.arena} | <strong>포그 밀도:</strong> ${s.fog}</p>
            <p>▸ <strong>전술 구조물:</strong> ${s.props}</p>
            <p>▸ <strong>교전 시퀀스:</strong> WAVE 1 (${s.wave1}) 섬멸 ➔ <strong>+${s.heal} HP 영혼 보급</strong> ➔ 보스 결전 (<strong>👑 ${s.boss}</strong>) ➔ 전리품 유물 (<code>${s.relic}</code>)</p>
          </div>`).join('');
      } else if (currentTab === 3) {
        area.innerHTML = `<div class="grid-2">${AX_DATA.enemies.map(e => `
          <div class="card emerald">
            <h2><span class="badge">STG-${e.stage}</span> ${e.name_ko} (${e.name_en})</h2>
            <p style="color:var(--text-sub);margin-bottom:8px;">전술 분류: ${e.role} | CODE: <code>${e.id}</code></p>
            ${statBar('내구도 (HP)', e.hp, 10, e.hp + ' HP', '#ff3b5c')}

            ${statBar('화력 / 주기', e.dmg, 4, e.dmg + ' DMG (' + e.cd + 's)', '#ffb800')}

      } else if (currentTab === 4) {
        area.innerHTML = AX_DATA.bosses.map(b => `
          <div class="card crimson">
            <h2><span class="badge ssr">EX-BOSS · OP-0${b.stage}</span> ${b.name_ko} — ${b.title_ko}</h2>
            <p style="color:#ffb800;margin-bottom:8px;">● MAX HP: <strong>${b.hp} HP</strong> | PHASE 1 SPD: ${b.spd1} m/s ➔ PHASE 2 (HP 50%↓) SPD: ${b.spd2} m/s</p>
            ${b.patterns.map(pat => `
              <div class="pattern-box">
                <strong>◢ [${pat.id}] ${pat.name_ko}</strong> — <span style="color:#ff3b5c;font-weight:700;">DAMAGE: ${pat.dmg}</span> | <span style="color:#00e5ff;">${pat.metrics}</span>
                <p style="color:#cbd5e1;font-size:12px;margin-top:3px;">↳ ${pat.desc}</p>
              </div>`).join('')}
          </div>`).join('');
      } else if (currentTab === 5) {
        area.innerHTML = `
          <div class="card amber">
            <h2>◢ 🔥 SANCTUARY CORE UPGRADE LAB (화톳불 영혼 제단 영구 강화 모듈)</h2>
            <table>
              <thead><tr><th>MODULE ID</th><th>UPGRADE NAME</th><th>COST</th><th>MAX LV</th><th>TACTICAL EFFECT</th></tr></thead>

            </table>
          </div>
          <div class="card purple">
            <h2>◢ 🏆 TACTICAL RELIC & GEAR EVOLUTION (보스 정복 전설/신화 아티팩트)</h2>
            <table>
              <thead><tr><th>OPERATION</th><th>RARITY</th><th>RELIC NAME</th><th>GEAR EVOLUTION</th><th>PASSIVE EFFECT</th></tr></thead>

            </table>
          </div>`;

    render();
