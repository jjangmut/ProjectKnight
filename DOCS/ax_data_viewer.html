  <style>
    :root {
      --bg-deep: #070b10;
      --bg-panel: #101923;
      --bg-card: #13202d;
      --border-gold: #ddc18a;
      --border-slate: #2c4254;
      --text-main: #f0e6d2;
      --text-sub: #9aaeb8;
      --accent-mint: #6ee7b7;
      --accent-blue: #60a5fa;
      --accent-red: #f87171;
      --accent-amber: #fbbf24;
      --accent-purple: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #132232 0%, var(--bg-deep) 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.55;
    }
    .container { max-width: 1360px; margin: 0 auto; }
    header {
      background: var(--bg-panel);
      border: 2px solid var(--border-gold);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      margin-bottom: 18px;
    }
    .brand h1 { font-size: 24px; color: var(--text-main); letter-spacing: 0.5px; }
    .brand p { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-input {
      background: #091017;
      border: 1px solid var(--border-slate);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      width: 300px;
      font-size: 14px;
    }
    .search-input:focus { outline: none; border-color: var(--border-gold); }
    .btn {
      background: #1b2c3b;
      border: 1px solid var(--border-slate);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn:hover, .btn.active {
      background: #294358;
      border-color: var(--border-gold);
      color: #fff8e7;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-slate);
      border-top: 3px solid var(--border-gold);
      border-radius: 10px;
      padding: 16px;
    }
    .kpi-card .label { font-size: 13px; color: var(--text-sub); }
    .kpi-card .val { font-size: 22px; font-weight: 700; margin: 6px 0 4px; color: var(--border-gold); }
    .kpi-card .desc { font-size: 12px; color: #cbd5e1; }
    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card h2 { font-size: 18px; color: var(--border-gold); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 14px; }
    .stat-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; font-size: 14px; }
    .stat-name { width: 170px; color: #cbd5e1; }
    .stat-bar-bg { flex: 1; height: 12px; background: #091119; border-radius: 6px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 6px; }
    .stat-val { width: 120px; text-align: right; font-weight: 600; color: #fff; }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: #1e3346;
      color: var(--accent-mint);
    }
    .pattern-box {
      background: #0b1219;
      border-left: 3px solid var(--accent-blue);
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 8px;
    }
    .swatch { width: 20px; height: 20px; border-radius: 5px; display: inline-block; border: 1px solid rgba(255,255,255,0.35); }
    pre.json-box {
      background: #070b10;
      border: 1px solid var(--accent-mint);
      color: #a7f3d0;
      padding: 18px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 13px;
      max-height: 72vh;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #1e2e3d; text-align: left; }
    th { color: var(--border-gold); background: #0c141d; }
  </style>

            { id: "DARK_CRESCENT_WAVE", name_ko: "암흑 초승달 공허 검기", dmg: 2, metrics: "탄속 13.5 m/s · 2페이즈 피해 3 강화", desc: "심연의 대검을 휘둘러 전방을 관통하는 흑자색 초승달 검기 사출" },
            { id: "SHADOW_BLINK_STRIKE", name_ko: "그림자 배후 순간이동 급습", dmg: 3, metrics: "플레이어 후방 2.2m 즉시 전이 후 참격", desc: "공허의 틈으로 사라진 뒤 플레이어 등 뒤 2.2m에 나타나 치명적인 베기 수행" },
            { id: "MELEE_CLEAVE", name_ko: "심판의 대검 2연격", dmg: 2, metrics: "사거리 2.6m · 광역 횡베기", desc: "보이드 에너지를 머금은 대검으로 전방을 넓게 2회 베어냄" },
            { id: "JUDGMENT_STORM", name_ko: "종말의 심판 보이드 스톰", dmg: 2, metrics: "2페이즈 궁극기 · 반경 5.5m 다단 공허 파동", desc: "공중으로 부양하며 성채 전체에 심연의 번개와 공허 충격파를 방사" }
          ]
        }
      ],
      shop: [
        { id: "hp_boost", name_ko: "생명의 축복 (Max HP +1)", cost: 25, max: 2, desc: "성기사의 최대 체력을 영구적으로 +1 증가 (최대 +2 HP)" },
        { id: "dmg_boost", name_ko: "칼날 연마 (Attack Power +1)", cost: 35, max: 1, desc: "모든 성검 기본 공격 및 콤보 피해량을 영구적으로 +1 증가" },
        { id: "shadow_dash", name_ko: "그림자 걸음 (Shadow Dash)", cost: 50, max: 1, desc: "적의 공격과 탄막을 무적으로 통과하는 그림자 회피 대시 해금" },
        { id: "heal_full", name_ko: "영혼의 성유 (체력 완전 회복)", cost: 10, max: 99, desc: "성스러운 기름으로 즉시 최대 체력까지 100% 회복" },
        { id: "shard_boost_30", name_ko: "성소의 기도 (파편 +30개 보급)", cost: 0, max: 99, desc: "성소의 축복(또는 VIP 즉시 수령)을 통해 영혼 파편 30개 즉시 획득" }
      ],
      relics: [
        { stage: 1, id: "bastion_shield", name_ko: "타락한 사령관의 수호 방패", title_ko: "성기사의 황금 대검 & 이지스", rarity: "전설 유물", color: "#ffd940", desc: "저스트 패링 시 3배 치명타 반격 및 가드 시 황금 이지스 결계 전개" },
        { stage: 2, id: "shadow_cloak", name_ko: "심연 맹수의 그림자 망토", title_ko: "윈드러너의 질주 날개", rarity: "전설 유물", color: "#1fc785", desc: "그림자 대시 쿨타임 -25% 감소 및 이동 속도 영구 증가" },
        { stage: 3, id: "piercing_quiver", name_ko: "폐허 저격수의 예기 화살깃", title_ko: "비전 룬 크리스탈 대검", rarity: "전설 유물", color: "#40e0ff", desc: "3단 콤보 피니셔 검기 사거리 +40% 및 탄속 +20% 증가" },
        { stage: 4, id: "golem_pauldrons", name_ko: "고대 수호자의 룬 견갑", title_ko: "타이탄 암석 중갑", rarity: "신화 유물", color: "#f2a633", desc: "최대 체력 +1 영구 증가 및 착지 시 대지 강타 충격파 발생" },
        { stage: 5, id: "abyssal_crown", name_ko: "심연 심판관의 공허 날개깃", title_ko: "심연 정복자의 뿔 면류관", rarity: "신화 유물", color: "#d973ff", desc: "저스트 패링 치명타 강화 및 기본 공격력 +1 영구 상승" }
      ]
    };

    const TABS = ["📊 전체 개요", "⚔ 플레이어 & 전투", "🏰 스테이지 1~5", "👾 몬스터 도감", "👑 보스 & 패턴", "🔥 성소 & 유물"];
    let currentTab = 0;
    let showJson = false;

    function selectTab(idx) {
      currentTab = idx;
      showJson = false;
      document.getElementById('searchInput').value = '';
      render();
    }

    function toggleJson() {
      showJson = !showJson;
      render();
    }

    function statBar(name, val, max, text, color) {
      const pct = Math.min(100, Math.max(5, (val / max) * 100));
      return `<div class="stat-row">
        <div class="stat-name">${name}</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <div class="stat-val">${text}</div>
      </div>`;
    }

    function render() {
      const tabBar = document.getElementById('tabBar');
      tabBar.innerHTML = TABS.map((t, i) => `<button class="btn ${i === currentTab && !showJson ? 'active' : ''}" onclick="selectTab(${i})">${t}</button>`).join('');
      document.getElementById('jsonBtn').textContent = showJson ? '📋 카드 뷰로 보기' : '{ } JSON 원본 보기';

      const area = document.getElementById('contentArea');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();

      if (showJson) {
        area.innerHTML = `<pre class="json-box">${JSON.stringify(AX_DATA, null, 2)}</pre>`;
        return;
      }

      if (q.length > 0) {
        const matches = [];
        if (JSON.stringify(AX_DATA.player).toLowerCase().includes(q)) matches.push({ cat: "플레이어", title: AX_DATA.player.name_ko, desc: "HP 8 · 이동속도 7.5 · 3단 성검 콤보 & 신성 관통창 검기 · 저스트 패링 0.14s" });
        AX_DATA.stages.forEach(s => { if (JSON.stringify(s).toLowerCase().includes(q)) matches.push({ cat: `Stage ${s.stage_num}`, title: s.name_ko, desc: `${s.theme} | 보스: ${s.boss} | 웨이브: ${s.wave1}` }); });
        AX_DATA.enemies.forEach(e => { if (JSON.stringify(e).toLowerCase().includes(q)) matches.push({ cat: `몬스터 (Stage ${e.stage})`, title: `${e.name_ko} (${e.role})`, desc: `HP ${e.hp} · 속도 ${e.speed} · ${e.mech}` }); });
        AX_DATA.bosses.forEach(b => { if (JSON.stringify(b).toLowerCase().includes(q)) matches.push({ cat: `보스 (Stage ${b.stage})`, title: `${b.name_ko} — ${b.title_ko}`, desc: `HP ${b.hp} · 패턴: ${b.patterns.map(p=>p.name_ko).join(', ')}` }); });
        AX_DATA.relics.forEach(r => { if (JSON.stringify(r).toLowerCase().includes(q)) matches.push({ cat: `유물 (Stage ${r.stage})`, title: `[${r.rarity}] ${r.name_ko}`, desc: r.desc }); });
        area.innerHTML = `<div class="card"><h2>🔍 '${q}' 검색 결과 (${matches.length}건)</h2>${matches.map(m => `<div class="pattern-box"><span class="badge">${m.cat}</span> <strong>${m.title}</strong><p style="margin-top:4px;color:#cbd5e1;">${m.desc}</p></div>`).join('') || '<p>일치하는 항목이 없습니다.</p>'}</div>`;
        return;
      }

      if (currentTab === 0) {
        area.innerHTML = `
          <div class="card">
            <h2>🏛 ${AX_DATA.meta.title_ko}</h2>
            <p style="color:#cbd5e1;">${AX_DATA.meta.description}</p>
          </div>
          <div class="kpi-grid">
            <div class="kpi-card"><div class="label">캠페인 스테이지</div><div class="val">5 개 지역</div><div class="desc">Stage 1 성문 외곽 ~ Stage 5 침묵의 성채</div></div>
            <div class="kpi-card"><div class="label">보스 & 시그니처 패턴</div><div class="val">보스 5종 / 패턴 17종</div><div class="desc">전 보스 2페이즈 각성 및 전용 기믹 탑재</div></div>
            <div class="kpi-card"><div class="label">일반/엘리트 몬스터</div><div class="val">5 종 아키타입</div><div class="desc">보병 · 도약 맹수 · 석궁병 · 거석 골렘 · 심연 기사</div></div>
            <div class="kpi-card"><div class="label">플레이어 액션 상태</div><div class="val">8 종 애니메이션</div><div class="desc">3단 성검 찌르기 · 관통창 검기 · 저스트 패링</div></div>
            <div class="kpi-card"><div class="label">성소 강화 & 유물</div><div class="val">강화 5종 / 유물 5종</div><div class="desc">영혼 파편 영구 성장 및 전설/신화 유물</div></div>
            <div class="kpi-card"><div class="label">카메라 & 물리 규격</div><div class="val">Pitch -32° / FOV 42°</div><div class="desc">사이드 쿼터뷰 벨트스크롤 · 4면 경계벽</div></div>
          </div>`;
      } else if (currentTab === 1) {
        const p = AX_DATA.player;
        area.innerHTML = `
          <div class="grid-2">
            <div class="card">
              <h2>🛡 ${p.name_ko} (${p.name_en}) 기본 스탯</h2>
              ${statBar('최대 체력 (Max HP)', p.base_stats.max_hp, 12, p.base_stats.max_hp + ' HP', '#ef4444')}
              ${statBar('횡이동 속도 (Speed X)', p.base_stats.move_speed_x, 15, p.base_stats.move_speed_x + ' m/s', '#38bdf8')}
              ${statBar('종이동 속도 (Depth Z)', p.base_stats.move_speed_z, 15, p.base_stats.move_speed_z + ' m/s', '#34d399')}
              ${statBar('회피 대시 속도 (Dash)', p.base_stats.dash_speed, 20, p.base_stats.dash_speed + ' m/s', '#a855f7')}
              ${statBar('피격 무적 (i-Frame)', p.base_stats.hit_invuln_duration, 1.5, p.base_stats.hit_invuln_duration + ' 초', '#eab308')}
            </div>
            <div class="card">
              <h2>⚔ 3단 성검 콤보 & 저스트 패링 공식</h2>
              <p>• <strong>기본 공격력:</strong> 2 DMG (지속 0.20s / 쿨타임 0.22s / 콤보 유지 0.95s)</p>
              <p>• <strong>하이브리드 근접 판정:</strong> 전방 X 2.9m × 깊이 Z ±1.65m (100% 적중 보장)</p>
              <p>• <strong>3단 피니셔 검기:</strong> 탄속 20.0 m/s · 사거리 24.0m · 관통 피해 2 DMG</p>
              <p>• <strong>저스트 패링:</strong> 0.14초 이내 가드 시 피해 100% 무효화 + 적 2.0초 스턴</p>
              <p>• <strong>패링 카운터:</strong> 3.5초간 다음 공격 3배 피해 (6 DMG 황금 강타)</p>
            </div>
          </div>
          <div class="card">
            <h2>🎞 플레이어 상태별 스프라이트 시트 규격 (780×780 무게중심 정렬)</h2>
            <table>
              <thead><tr><th>상태 (State)</th><th>스프라이트 시트</th><th>그리드 (프레임)</th><th>FPS</th><th>기획 설명</th></tr></thead>
              <tbody>${p.animations.map(a => `<tr><td><span class="badge">${a.state}</span></td><td><code>${a.sheet}</code></td><td>${a.grid}</td><td>${a.fps} FPS</td><td>${a.desc}</td></tr>`).join('')}</tbody>
            </table>
          </div>`;
      } else if (currentTab === 2) {
        area.innerHTML = AX_DATA.stages.map(s => `
          <div class="card" style="border-left: 5px solid ${s.ambient};">
            <h2><span class="swatch" style="background:${s.ambient};"></span> STAGE ${s.stage_num} — ${s.name_ko} (${s.name_en})</h2>
            <p>• <strong>테마:</strong> ${s.theme} | <strong>아레나 규격:</strong> ${s.arena} | <strong>포그 밀도:</strong> ${s.fog}</p>
            <p>• <strong>환경 프롭:</strong> ${s.props}</p>
            <p>• <strong>진행 루프:</strong> Wave 1 (${s.wave1}) 섬멸 ➔ <strong>+${s.heal} HP 성스러운 회복</strong> ➔ 보스 조우 (<strong>👑 ${s.boss}</strong>) ➔ 클리어 유물 (<code>${s.relic}</code>)</p>
          </div>`).join('');
      } else if (currentTab === 3) {
        area.innerHTML = `<div class="grid-2">${AX_DATA.enemies.map(e => `
          <div class="card">
            <h2>[Stage ${e.stage}] ${e.name_ko} (${e.name_en})</h2>
            <p style="color:var(--text-sub);margin-bottom:8px;">역할군: ${e.role} | ID: <code>${e.id}</code></p>
            ${statBar('체력 (HP)', e.hp, 10, e.hp + ' HP', '#ef4444')}
            ${statBar('이동 속도', e.speed, 10, e.speed + ' m/s', '#38bdf8')}
            ${statBar('공격력 / 주기', e.dmg, 4, e.dmg + ' DMG (' + e.cd + 's)', '#f59e0b')}
            <p style="margin-top:8px;">💡 <strong>고유 기믹:</strong> ${e.mech}</p>
          </div>`).join('')}</div>`;
      } else if (currentTab === 4) {
        area.innerHTML = AX_DATA.bosses.map(b => `
          <div class="card">
            <h2>👑 [Stage ${b.stage} 보스] ${b.name_ko} — ${b.title_ko}</h2>
            <p style="color:#fde68a;margin-bottom:8px;">최대 체력: <strong>${b.hp} HP</strong> | 1페이즈 속도: ${b.spd1} m/s ➔ 2페이즈(HP 50% 이하) 속도: ${b.spd2} m/s</p>
            ${b.patterns.map(pat => `
              <div class="pattern-box">
                <strong>⚡ [${pat.id}] ${pat.name_ko}</strong> — <span style="color:#fca5a5;">피해량: ${pat.dmg} DMG</span> | <span style="color:#93c5fd;">${pat.metrics}</span>
                <p style="color:#cbd5e1;font-size:13px;margin-top:3px;">↳ ${pat.desc}</p>
              </div>`).join('')}
          </div>`).join('');
      } else if (currentTab === 5) {
        area.innerHTML = `
          <div class="card">
            <h2>🔥 화톳불의 영혼 제단 (Campfire Soul Altar) 영구 강화 테이블</h2>
            <table>
              <thead><tr><th>아이템 ID</th><th>강화 명칭</th><th>비용 (영혼 파편)</th><th>최대 레벨</th><th>강화 효과</th></tr></thead>
              <tbody>${AX_DATA.shop.map(s => `<tr><td><code>${s.id}</code></td><td><strong>${s.name_ko}</strong></td><td>${s.cost} Shards</td><td>Lv.${s.max}</td><td>${s.desc}</td></tr>`).join('')}</tbody>
            </table>
          </div>
          <div class="card">
            <h2>🏆 스테이지 보스 정복 유물 & 외형 진화 (Stage Relics)</h2>
            <table>
              <thead><tr><th>스테이지</th><th>등급</th><th>유물 명칭</th><th>외형 진화 타이틀</th><th>유물 패시브 효과</th></tr></thead>
              <tbody>${AX_DATA.relics.map(r => `<tr><td>Stage ${r.stage}</td><td><span class="badge" style="color:${r.color};">${r.rarity}</span></td><td><strong>${r.name_ko}</strong></td><td>${r.title_ko}</td><td>${r.desc}</td></tr>`).join('')}</tbody>
            </table>
          </div>`;
      }
    }

    render();
  </script>
</body>
</html>
